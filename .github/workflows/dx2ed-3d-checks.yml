name: DX2Ed 3D viewer checks
on:
  push:
    paths:
      - 'dx2ed_3d/**'
      - 'map_exporter/**'
      - 'actor_explorer/**'
      - '.github/workflows/dx2ed-3d-checks.yml'
  pull_request:
    paths:
      - 'dx2ed_3d/**'
      - 'map_exporter/**'
      - 'actor_explorer/**'
      - '.github/workflows/dx2ed-3d-checks.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source
        run: |
          python -m py_compile dx2ed_3d/dx2ed_3d.py
          python -m py_compile map_exporter/*.py actor_explorer/*.py
      - name: Test source without commercial game assets
        run: python -m unittest discover -s dx2ed_3d/tests -v
