name: DX2 hosted Ghidra 12.2 original research

on:
  pull_request:
    paths:
      - 'tools/ghidra/**'
      - '.github/workflows/dx2-ghidra-hosted.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 3,15 * * *'

permissions:
  contents: read

jobs:
  source-fixtures:
    name: Synthetic PE ZIP and research metadata checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test SHA-pinned private PE staging without original files
        run: |
          python -m unittest discover -s tools/ghidra/tests -p 'test_*.py' -v
          bash -n tools/ghidra/install_pinned_ghidra.sh
          python -c 'import sys; sys.path.insert(0,"tools/ghidra"); from stage_original_pe_from_zip import load_expectations; assert len(load_expectations(__import__("pathlib").Path("tools/ghidra/dx2_system_pe_pins.json"))) == 2'

  hosted-ghidra-smoke:
    name: Real Ghidra 12.2 on harmless synthetic ELF
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: source-fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ghidra-archive/ghidra_12.2_PUBLIC_20261016.zip
          key: verified-ghidra-12-2-sha256-2c2cd776
      - name: Install original SHA256-verified Ghidra binary
        run: |
          set -euo pipefail
          GHIDRA_HOME="$(bash tools/ghidra/install_pinned_ghidra.sh "$RUNNER_TEMP/ghidra-archive" "$RUNNER_TEMP/ghidra-installed")"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
      - name: Compile synthetic test and execute actual DX2 Java Ghidra survey
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dx2-ghidra-synthetic" "$RUNNER_TEMP/dx2-ghidra-project"
          printf '%s\n' 'int helper(int x) { return x + 5; }' 'int main(void) { return helper(37) == 42 ? 0 : 1; }' > "$RUNNER_TEMP/dx2-ghidra-synthetic/test.c"
          cc -O0 -fno-inline -o "$RUNNER_TEMP/dx2-ghidra-synthetic/test" "$RUNNER_TEMP/dx2-ghidra-synthetic/test.c"
          "$GHIDRA_HOME/support/analyzeHeadless" "$RUNNER_TEMP/dx2-ghidra-project" DX2Synthetic \
            -import "$RUNNER_TEMP/dx2-ghidra-synthetic/test" \
            -scriptPath "$GITHUB_WORKSPACE/tools/ghidra/scripts" \
            -postScript Dx2SymbolSurvey.java "$RUNNER_TEMP/dx2-ghidra-synthetic/survey.json" \
            -deleteProject
          python - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, "tools/ghidra")
          from run_private_survey import sanitize_report
          root = Path(os.environ["RUNNER_TEMP"])/"dx2-ghidra-synthetic"
          doc = json.loads((root/"survey.json").read_text())
          sha = hashlib.sha256((root/"test").read_bytes()).hexdigest()
          result = sanitize_report(doc, digest=sha, role="EXE")
          assert result["function_count"] > 0
          assert result["game_assets_included"] is False
          assert result["retail_runtime_verified"] is False
          print("DX2 real hosted Ghidra 12.2 + Java postScript synthetic PASS")
          PY

  owner-input-gate:
    name: Detect opt-in owner Drive secret without exposing it
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.detect.outputs.ready }}
    steps:
      - name: Check for owner-controlled original Drive ID
        id: detect
        env:
          SOURCE_ID: ${{ secrets.DX2_ORIGINAL_SYSTEM_ZIP_ID }}
        run: |
          if [[ -n "$SOURCE_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Original PE analysis is enabled by owner configuration."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Original PE analysis not configured: no files downloaded, no Ghidra launched."
          fi

  hosted-original:
    name: Opt-in owner-original DX2 PE batch on ephemeral GitHub runner
    needs: [source-fixtures, owner-input-gate]
    if: >-
      ${{ needs.owner-input-gate.outputs.ready == 'true' &&
          github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: dx2-original-ghidra-hosted
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require original System.zip locator (SHA256 pins are committed)
        env:
          SOURCE_ID: ${{ secrets.DX2_ORIGINAL_SYSTEM_ZIP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_ID" ]]; then
            echo "::error::Configure DX2_ORIGINAL_SYSTEM_ZIP_ID repository Actions secret; original binaries are never uploaded to GitHub"
            exit 2
          fi
      - name: Download owner original ZIP into runner-only scratch
        env:
          SOURCE_ID: ${{ secrets.DX2_ORIGINAL_SYSTEM_ZIP_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/dx2-owner-private"
          python -m pip install --disable-pip-version-check --quiet 'gdown==5.2.0'
          python - <<'PY'
          import os
          from pathlib import Path
          import gdown
          folder = Path(os.environ["RUNNER_TEMP"])/"dx2-owner-private"
          if not gdown.download(id=os.environ["SOURCE_ID"],output=str(folder/"system.zip"),quiet=True):
              raise SystemExit("Owner Google Drive download unavailable; check access and quota")
          PY
      - name: Verify all original full-file SHA256s before analysis
        run: |
          set -euo pipefail
          umask 077
          python -B tools/ghidra/stage_original_pe_from_zip.py \
            --archive "$RUNNER_TEMP/dx2-owner-private/system.zip" \
            --manifest "tools/ghidra/dx2_system_pe_pins.json" \
            --output-dir "$RUNNER_TEMP/dx2-owner-private/verified"
          python - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"dx2-owner-private"
          images=sorted((root/"verified").iterdir())
          assert 1 <= len(images) <= 8
          (root/"originals.txt").write_text("\n".join(str(p.resolve()) for p in images)+"\n")
          PY
      - name: Restore sanitized evidence cache if source hashes and analyzer are unchanged
        uses: actions/cache@v4
        id: safe-report-cache
        with:
          path: ${{ runner.temp }}/dx2-metadata/dx2_research_summary.json
          key: dx2-ghidra-strict-12-2-${{ hashFiles('tools/ghidra/dx2_system_pe_pins.json', 'tools/ghidra/scripts/Dx2SymbolSurvey.java', 'tools/ghidra/run_private_survey.py', 'tools/ghidra/validate_hosted_summary.py') }}
      # A cache hit bypasses Ghidra's Java setup, archive restore and
      # installation. We have already SHA-verified original inputs above.
      - uses: actions/setup-java@v4
        if: steps.safe-report-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        if: steps.safe-report-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ghidra-archive/ghidra_12.2_PUBLIC_20261016.zip
          key: verified-ghidra-12-2-sha256-2c2cd776
      - name: Install verified Ghidra only when new analysis is necessary
        if: steps.safe-report-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          GHIDRA_HOME="$(bash tools/ghidra/install_pinned_ghidra.sh "$RUNNER_TEMP/ghidra-archive" "$RUNNER_TEMP/ghidra-installed")"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
      - name: Run private Ghidra only if verified metadata is not already cached
        if: steps.safe-report-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          umask 077
          python -B tools/ghidra/run_private_survey.py \
            --manifest "$RUNNER_TEMP/dx2-owner-private/originals.txt" \
            --ghidra-home "$GHIDRA_HOME" \
            --report-dir "$RUNNER_TEMP/dx2-metadata"
      - name: Revalidate full pinned fingerprint set and strict metadata allowlist
        run: |
          set -euo pipefail
          python -B tools/ghidra/validate_hosted_summary.py \
            --summary "$RUNNER_TEMP/dx2-metadata/dx2_research_summary.json" \
            --pins "tools/ghidra/dx2_system_pe_pins.json"
      - name: Upload sanitized metadata only (no retail binaries or pseudocode)
        uses: actions/upload-artifact@v4
        with:
          name: dx2-ghidra-hosted-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/dx2-metadata/dx2_research_summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Delete owner original PE images and temporary findings
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/dx2-owner-private" "$RUNNER_TEMP/dx2-metadata"
