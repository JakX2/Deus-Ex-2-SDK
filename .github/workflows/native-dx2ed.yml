name: Native DX2Ed scene-fixture checks

on:
  push:
    paths:
      - 'native_editor/**'
      - '.github/workflows/native-dx2ed.yml'
  pull_request:
    paths:
      - 'native_editor/**'
      - '.github/workflows/native-dx2ed.yml'
  workflow_dispatch:

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate original demo scene
        run: python native_editor/tests/make_demo_scene.py
      - name: Test GLB structure, actor links, and safety
        run: python -m unittest discover -s native_editor/tests -v
      - name: Install Godot 4.3 for headless GDScript tests
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -o /tmp/godot-4.3.zip \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot-4.3.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Compile source-surface MatLib cross-reference panel (Godot 4.3)
        run: timeout 20s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://source_surface_matlib_crossref.gd
      - name: Exercise source-surface MatLib cross-reference panel
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_source_surface_matlib_crossref.gd
      - name: Compile source-section topology Inspector (Godot 4.3)
        run: timeout 20s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://source_section_topology_panel.gd
      - name: Exercise original source-section topology Inspector
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_source_section_topology.gd
      - name: Compile source-section fill preview helper (Godot 4.3)
        run: timeout 20s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://source_section_fill_preview.gd
      - name: Compile exact-weld source-section edge overlay helper (Godot 4.3)
        run: timeout 20s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://source_section_edge_overlay.gd
      - name: Compile source-section edge hover picker (Godot 4.3)
        run: timeout 20s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://source_section_edge_picker.gd
      - name: Compile source-section exact-weld vertex picker (Godot 4.3)
        run: timeout 20s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://source_section_vertex_picker.gd
      - name: Compile full DX2Ed main editor script (Godot 4.3)
        run: timeout 30s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://main.gd
      - name: Compile independent multi-view camera state helpers (Godot 4.3)
        run: timeout 20s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://orthographic_authoring_guides.gd
      - name: Exercise independent quad cameras and private workspace persistence
        run: timeout 30s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_multi_view_workspace.gd
      - name: Exercise active-pane orthographic gizmos, plane drag and private transform round-trip
        run: timeout 35s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_orthographic_gizmo_constraints.gd
      - name: Exercise transform pivot/orientation preferences and private cursor persistence
        run: timeout 35s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_transform_pivot_orientation.gd
      - name: Exercise editor-private group hierarchy, parent transforms and private JSON reopen
        run: timeout 40s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_draft_group_hierarchy.gd
      - name: Exercise exact source actor unplace selection and refusal of mixed draft changes
        run: timeout 30s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_native_static_unplace.gd
      - name: Exercise combined source-verified move, clone and unplace native plan
        run: timeout 35s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_native_combined_prop_plan.gd
      - name: Verify asset-free portable native mod recipe chooser and source refusal
        run: timeout 35s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_native_mod_recipe.gd
      - name: Verify v0.63 original GMP and IBD script cross-source review gate
        run: timeout 35s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_crosssource_reference_review.gd
      - name: Verify v0.64 source-only private retail A/B test dossier chooser
        run: timeout 35s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_native_retail_trial_dossier.gd
      - name: Verify v0.65 isolated disposable game copy UI and no-original-source guard
        run: timeout 35s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_disposable_retail_trial.gd
      - name: Compile retail observation UI in isolation (Godot 4.3)
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://retail_observation_panel.gd
      - name: Smoke owner-only retail observation UI with no original source
        run: timeout 35s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_retail_observation_panel.gd
      - name: Compile custom polygon geometry in isolation (Godot 4.3)
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://custom_polygon_geometry.gd
      - name: Exercise actual custom polygon authoring and full private scene reopen
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_custom_polygon_geometry.gd
      - name: Compile standalone closed private 3D Box clip helper
        run: timeout 20s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://private_box_clip.gd
      - name: Compile source-only convex 3D multi-plane Box clip helper
        run: timeout 20s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://private_box_multiclip.gd
