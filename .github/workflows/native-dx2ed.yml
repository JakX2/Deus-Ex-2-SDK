      - name: Exercise v0.80 actual Box clip, manifold, Undo/Redo and private Save/reopen
        run: timeout 35s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_t3ed_face_edit_roundtrip.gd
      - name: Verify source-backed MatLib browser UI and preview integrity
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_matlib_browser.gd
      - name: Verify source-backed MatLib diffuse assignment to private Polygon surface
