name: Native DX2Ed scene-fixture checks

on:
  push:
    paths:
      - 'native_editor/**'
      - '.github/workflows/native-dx2ed.yml'
  pull_request:
    paths:
      - 'native_editor/**'
      - '.github/workflows/native-dx2ed.yml'
  workflow_dispatch:

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate original demo scene
        run: python native_editor/tests/make_demo_scene.py
      - name: Test GLB structure, actor links, and safety
        run: python -m unittest discover -s native_editor/tests -v
      - name: Install Godot 4.3 for headless GDScript tests
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -o /tmp/godot-4.3.zip \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot-4.3.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
      - name: Compile source-surface MatLib cross-reference panel (Godot 4.3)
        run: timeout 20s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://source_surface_matlib_crossref.gd
      - name: Exercise source-surface MatLib cross-reference panel
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_source_surface_matlib_crossref.gd
      - name: Compile source-section topology Inspector (Godot 4.3)
        run: timeout 20s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://source_section_topology_panel.gd
      - name: Exercise original source-section topology Inspector
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_source_section_topology.gd
      - name: Compile source-section fill preview helper (Godot 4.3)
        run: timeout 20s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://source_section_fill_preview.gd
      - name: Compile exact-weld source-section edge overlay helper (Godot 4.3)
        run: timeout 20s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://source_section_edge_overlay.gd
      - name: Compile source-section edge hover picker (Godot 4.3)
        run: timeout 20s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://source_section_edge_picker.gd
      - name: Compile full DX2Ed main editor script (Godot 4.3)
        run: timeout 30s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://main.gd
      - name: Compile custom polygon geometry in isolation (Godot 4.3)
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --check-only --script res://custom_polygon_geometry.gd
      - name: Exercise actual custom polygon authoring and full private scene reopen
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_custom_polygon_geometry.gd
      - name: Verify source-backed MatLib browser UI and preview integrity
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_matlib_browser.gd
      - name: Verify source-backed MatLib diffuse assignment to private Polygon surface
        run: timeout 30s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_matlib_polygon_assignment.gd
      - name: Verify original mission versus Kernel TriggerScript payload comparison
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_mission_kernel_script_view.gd
      - name: Verify map-wide original actor script index offset audit
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_script_index_hypothesis_audit.gd
      - name: Verify original TriggerScript IBD evidence presentation
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_original_script_ibd_provenance.gd
      - name: Verify source-pinned dialogue tree design in Godot
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_dialogue_design_draft.gd
      - name: Verify source-pinned TriggerScript design draft in Godot
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_mission_logic_draft.gd
      - name: Run packaged Python interpreter worker smoke test
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_python_runtime.gd
      - name: Run native triangle picker smoke test
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_triangle_picking.gd
      - name: Run source collision picking smoke test
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_source_collision_picker.gd
      - name: Run capsule contact research overlay smoke test
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_capsule_contact_preview.gd
      - name: Run interactive capsule sweep picking smoke test
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_interactive_capsule_sweep.gd
      - name: Run source surface slope and elevation diagnostics smoke test
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_source_surface_step_diagnostics.gd
      - name: Run exact original source edge connectivity smoke test
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_exact_source_edge_transitions.gd
      - name: Run source-exact capsule crossing probe smoke test
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_source_edge_capsule_probe.gd
      - name: Run source edge capsule height overlay smoke test
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_source_edge_capsule_height_overlay.gd
      - name: Run source edge capsule height detailed replay smoke test
        run: timeout 25s /tmp/Godot_v4.3-stable_linux.x86_64 --headless --path native_editor/godot_editor --script res://tests/smoke_source_edge_capsule_height_replay.gd
